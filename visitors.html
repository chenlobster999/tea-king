<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>公共住宅門禁管理系統｜訪客管理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body data-page="visitors">
    <div class="app-shell">
      <header class="app-header">
        <div class="brand">
          <div class="brand-badge">PH</div>
          <div>
            <h1>公共住宅門禁管理系統</h1>
            <p>訪客申請與出入流程</p>
          </div>
        </div>
        <div class="header-meta">
          <div class="meta-label">值班人員</div>
          <div class="meta-value" id="operatorLabel">管理員</div>
          <div class="meta-value" id="liveClock">--</div>
        </div>
      </header>

      <nav class="page-nav" aria-label="功能分頁">
        <a href="index.html" data-nav="dashboard">系統總覽</a>
        <a href="register.html" data-nav="register">住戶登記</a>
        <a href="lock.html" data-nav="lock">門禁鎖定</a>
        <a href="unlock.html" data-nav="unlock">門禁解鎖</a>
        <a href="visitors.html" data-nav="visitors">訪客管理</a>
        <a href="logs.html" data-nav="logs">通行紀錄</a>
        <a href="settings.html" data-nav="settings">系統設定</a>
      </nav>

      <main class="layout">
        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>訪客登記</h2>
              <p>登記後可由管理員核准並追蹤進出時間。</p>
            </div>
          </div>
          <form id="visitorForm">
            <div class="form-grid">
              <label>
                訪客姓名
                <input type="text" name="name" required placeholder="例：陳大文" />
              </label>
              <label>
                身分證/證件號
                <input type="text" name="idNo" required placeholder="例：A123456789" />
              </label>
              <label>
                拜訪戶號
                <input type="text" name="hostUnit" required placeholder="B 棟 12F-01" />
              </label>
              <label>
                拜訪時段
                <input type="text" name="visitWindow" placeholder="例：14:00-16:00" />
              </label>
              <label>
                事由
                <input type="text" name="purpose" required placeholder="例：維修、送貨、探訪" />
              </label>
            </div>
            <div class="btn-row">
              <button type="submit">新增訪客申請</button>
            </div>
          </form>
        </section>

        <section class="panel">
          <div class="panel-head">
            <div>
              <h3>訪客清單</h3>
              <p>狀態流程：待審核 → 已核准 → 已入場 → 已離場。</p>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>申請時間</th>
                  <th>姓名</th>
                  <th>證件號</th>
                  <th>拜訪戶號</th>
                  <th>時段</th>
                  <th>事由</th>
                  <th>通行碼</th>
                  <th>狀態</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="visitorTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
