<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>公共住宅門禁管理系統｜住戶登記</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body data-page="register">
    <div class="app-shell">
      <header class="app-header">
        <div class="brand">
          <div class="brand-badge">PH</div>
          <div>
            <h1>公共住宅門禁管理系統</h1>
            <p>住戶資料登記與權限管理</p>
          </div>
        </div>
        <div class="header-meta">
          <div class="meta-label">值班人員</div>
          <div class="meta-value" id="operatorLabel">管理員</div>
          <div class="meta-value" id="liveClock">--</div>
        </div>
      </header>

      <nav class="page-nav" aria-label="功能分頁">
        <a href="index.html" data-nav="dashboard">系統總覽</a>
        <a href="register.html" data-nav="register">住戶登記</a>
        <a href="lock.html" data-nav="lock">門禁鎖定</a>
        <a href="unlock.html" data-nav="unlock">門禁解鎖</a>
        <a href="visitors.html" data-nav="visitors">訪客管理</a>
        <a href="logs.html" data-nav="logs">通行紀錄</a>
        <a href="settings.html" data-nav="settings">系統設定</a>
      </nav>

      <main class="layout">
        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>住戶登記</h2>
              <p>建立住戶門卡資料，支援啟用與停用。</p>
            </div>
          </div>
          <form id="residentForm">
            <div class="form-grid">
              <label>
                姓名
                <input type="text" name="name" required placeholder="例：王小明" />
              </label>
              <label>
                棟別/戶號
                <input type="text" name="unit" required placeholder="A 棟 8F-02" />
              </label>
              <label>
                聯絡電話
                <input type="tel" name="phone" placeholder="09xx-xxx-xxx" />
              </label>
              <label>
                門卡編號
                <input type="text" name="cardId" required placeholder="CARD-0001" />
              </label>
              <label>
                備用 PIN
                <input type="text" name="pin" placeholder="4~6 碼" />
              </label>
            </div>
            <div class="btn-row">
              <button type="submit">新增住戶</button>
              <button type="reset" class="secondary">清空輸入</button>
            </div>
          </form>
        </section>

        <section class="panel">
          <div class="panel-head">
            <div>
              <h3>住戶名單</h3>
              <p>可搜尋、停用與重新啟用住戶權限。</p>
            </div>
            <label>
              快速搜尋
              <input type="search" id="residentSearch" placeholder="姓名 / 戶號 / 卡號" />
            </label>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>姓名</th>
                  <th>戶號</th>
                  <th>電話</th>
                  <th>門卡</th>
                  <th>狀態</th>
                  <th>建立時間</th>
                  <th>最後通行</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="residentTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
