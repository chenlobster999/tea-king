<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>公共住宅門禁管理系統｜通行紀錄</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body data-page="logs">
    <div class="app-shell">
      <header class="app-header">
        <div class="brand">
          <div class="brand-badge">PH</div>
          <div>
            <h1>公共住宅門禁管理系統</h1>
            <p>事件紀錄查詢</p>
          </div>
        </div>
        <div class="header-meta">
          <div class="meta-label">值班人員</div>
          <div class="meta-value" id="operatorLabel">管理員</div>
          <div class="meta-value" id="liveClock">--</div>
        </div>
      </header>

      <nav class="page-nav" aria-label="功能分頁">
        <a href="index.html" data-nav="dashboard">系統總覽</a>
        <a href="register.html" data-nav="register">住戶登記</a>
        <a href="lock.html" data-nav="lock">門禁鎖定</a>
        <a href="unlock.html" data-nav="unlock">門禁解鎖</a>
        <a href="visitors.html" data-nav="visitors">訪客管理</a>
        <a href="logs.html" data-nav="logs">通行紀錄</a>
        <a href="settings.html" data-nav="settings">系統設定</a>
      </nav>

      <main class="layout">
        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>紀錄查詢條件</h2>
              <p>可依事件類型與日期過濾。</p>
            </div>
          </div>
          <div class="form-grid">
            <label>
              事件類型
              <select id="logTypeFilter">
                <option value="all">全部</option>
                <option value="resident">住戶</option>
                <option value="door">門禁</option>
                <option value="visitor">訪客</option>
                <option value="system">系統</option>
              </select>
            </label>
            <label>
              日期
              <input id="logDateFilter" type="date" />
            </label>
          </div>
          <div class="btn-row">
            <button id="applyLogFilterBtn" type="button">套用查詢</button>
            <button id="clearLogFilterBtn" type="button" class="secondary">清除條件</button>
            <button id="exportLogsBtn" type="button" class="warn">匯出事件紀錄 JSON</button>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <div>
              <h3>事件明細</h3>
              <p>所有操作都會寫入不可逆記錄。</p>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>時間</th>
                  <th>類型</th>
                  <th>目標</th>
                  <th>動作</th>
                  <th>操作者</th>
                  <th>備註</th>
                </tr>
              </thead>
              <tbody id="logTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
